# Ative com SPRING_PROFILES_ACTIVE=auth0.
# As duas variaveis abaixo passam a ser obrigatorias somente neste perfil.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

# A Action do Auth0 deve publicar uma lista de roles neste claim.
app.auth0.roles-claim=${AUTH0_ROLES_CLAIM:https://projsoft.com/roles}
