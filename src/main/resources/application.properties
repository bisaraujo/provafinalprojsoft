spring.application.name=provafinal
server.port=${SERVER_PORT:8080}

# Modo padrao: funciona sozinho, sem Docker, PostgreSQL ou Auth0.
spring.datasource.url=${H2_URL:jdbc:h2:file:./data/provafinal}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_USER:sa}
spring.datasource.password=${H2_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
