name: Deploy manual - Docker Hub e AWS

# Manual de proposito: nada sera publicado na VM durante a preparacao.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/provafinal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar aplicacao na EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          AUTH0_ISSUER_URI: ${{ secrets.AUTH0_ISSUER_URI }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_ROLES_CLAIM: ${{ vars.AUTH0_ROLES_CLAIM }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,SPRING_PROFILES_ACTIVE,AUTH0_ISSUER_URI,AUTH0_AUDIENCE,AUTH0_ROLES_CLAIM,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -eu
            docker network inspect provafinal-rede >/dev/null 2>&1 || docker network create provafinal-rede

            case ",${SPRING_PROFILES_ACTIVE:-}," in
              *,postgres,*)
                docker volume create provafinal-postgres-data >/dev/null
                docker rm -f provafinal-postgres >/dev/null 2>&1 || true
                docker run -d \
                  --name provafinal-postgres \
                  --restart unless-stopped \
                  --network provafinal-rede \
                  -e POSTGRES_DB="${DB_NAME:-provafinal}" \
                  -e POSTGRES_USER="${DB_USER:-postgres}" \
                  -e POSTGRES_PASSWORD="${DB_PASSWORD:-postgres}" \
                  -v provafinal-postgres-data:/var/lib/postgresql/data \
                  postgres:17-alpine
                ;;
            esac

            docker pull "$IMAGE_NAME:latest"
            docker volume create provafinal-h2-data >/dev/null
            docker rm -f provafinal-app >/dev/null 2>&1 || true
            docker run -d \
              --name provafinal-app \
              --restart unless-stopped \
              --network provafinal-rede \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-}" \
              -e AUTH0_ISSUER_URI="${AUTH0_ISSUER_URI:-}" \
              -e AUTH0_AUDIENCE="${AUTH0_AUDIENCE:-}" \
              -e AUTH0_ROLES_CLAIM="${AUTH0_ROLES_CLAIM:-https://projsoft.com/roles}" \
              -e DB_HOST=provafinal-postgres \
              -e DB_PORT=5432 \
              -e DB_NAME="${DB_NAME:-provafinal}" \
              -e DB_USER="${DB_USER:-postgres}" \
              -e DB_PASSWORD="${DB_PASSWORD:-postgres}" \
              -v provafinal-h2-data:/app/data \
              "$IMAGE_NAME:latest"

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
                echo "Aplicacao saudavel."
                exit 0
              fi
              sleep 2
            done

            docker logs provafinal-app
            exit 1

